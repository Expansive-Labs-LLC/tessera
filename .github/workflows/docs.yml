# Docs Workflow — build the MkDocs site and publish it to GitHub Pages
#
# Build runs on every PR that touches the docs so a broken nav entry or config
# change fails review instead of the published site. Deploy runs only on main.

name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  # Lets you republish without pushing a docs change.
  workflow_dispatch:

# Least privilege by default; the deploy job widens it for itself.
permissions:
  contents: read

# One publish at a time. In-progress deploys are allowed to finish rather than
# being cancelled, so Pages is never left serving a half-uploaded site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git-revision-date-localized reads commit history to stamp each
          # page's "last updated" date; a shallow clone makes it fall back to
          # the build date for everything.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build site
        working-directory: docs
        run: mkdocs build --site-dir ../site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    # Only main publishes; PRs stop after the build above.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write      # publish to the Pages site
      id-token: write   # OIDC token the deploy action exchanges
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
