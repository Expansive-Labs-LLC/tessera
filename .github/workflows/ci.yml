# CI Workflow — Pull Request Checks
# Spec: SPEC-TS-0014 (FR-001 – FR-008)
#
# Pipeline: commitlint (parallel) + lint → test → build (sequential)
# All jobs: timeout-minutes: 10

name: CI

# FR-001: Trigger on PRs targeting main
on:
  pull_request:
    branches:
      - main
  # Manual re-run from the Actions tab. The ref is chosen in the UI, so this
  # works against any branch, not just main.
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # FR-006: Commitlint — runs in parallel (no needs dependency)
  # ---------------------------------------------------------------------------
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install commitlint
        run: npm install --save-dev @commitlint/cli @commitlint/config-conventional

      - name: Validate commits
        env:
          # These are empty on anything other than a pull_request, so the range
          # is resolved in the shell rather than interpolated into the command.
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$PR_BASE" ]; then
            # On a PR, lint exactly the commits the PR adds.
            FROM="$PR_BASE"
            TO="$PR_HEAD"
          else
            # On a manual run there is no PR context, so lint whatever this ref
            # adds on top of the default branch. Dispatching the default branch
            # itself gives an empty range, which commitlint passes.
            BASE="origin/${DEFAULT_BRANCH:-main}"
            if git rev-parse --verify --quiet "$BASE" >/dev/null; then
              FROM="$BASE"
            else
              # Shallow or missing remote ref: fall back to the last commit.
              echo "::notice::$BASE not available; linting the head commit only"
              FROM="${HEAD_SHA}~1"
            fi
            TO="$HEAD_SHA"
          fi
          echo "Linting commits in range $FROM..$TO"
          npx commitlint --from "$FROM" --to "$TO"

  # ---------------------------------------------------------------------------
  # FR-002, FR-002b: Lint — isort, black, flake8, mypy
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          test -f requirements.txt && pip install -r requirements.txt
          # Pinned: an unpinned linter silently changes the rules under the
          # repo whenever a new release lands, which is how this job first
          # started failing.
          pip install -r requirements-lint.txt

      # tessera_engine/ ships separately from the add-on but lives in this
      # repo and holds the other half of the SPEC-TS-0023 boundary. Leaving
      # it out of lint would let the two halves drift in style and in types
      # while every check stayed green.
      - name: isort
        run: isort --check --diff tessera/ tessera_engine/ tests/

      - name: black
        run: black --check tessera/ tessera_engine/ tests/

      - name: flake8
        run: flake8 tessera/ tessera_engine/ tests/

      - name: mypy
        run: mypy tessera/ tessera_engine/ --ignore-missing-imports

  # ---------------------------------------------------------------------------
  # FR-003, FR-005: Test — pytest with Python matrix, depends on lint
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          test -f requirements.txt && pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # FR-004, FR-005: Build — trial packaging, depends on test
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trial build
        run: bash scripts/build_addon.sh 0.0.0-ci

      - name: Upload trial artifact
        uses: actions/upload-artifact@v4
        with:
          name: tessera-ci-build
          path: tessera-v0.0.0-ci.zip
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Smoke — load the built add-on in Blender and assert it works.
  #
  # The unit suite mocks `bpy`, so defects that only appear once Blender
  # imports the package pass it untouched: a nested archive root, an
  # AddonPreferences bl_idname that does not match the package name, a
  # hard-coded preferences key, a positionally-called extension_path_user().
  # Every one of those shipped. This job is the gate that would have caught
  # them, and `scripts/smoke_test_addon.py` documents which check maps to
  # which defect.
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke (Blender)
    runs-on: ubuntu-latest
    # FR-008: every CI job is capped at 10 minutes. A cold Blender download
    # is ~300 MB and the run itself is seconds, so this fits comfortably;
    # the cache makes the common case trivial.
    timeout-minutes: 10
    needs: build
    env:
      # Pin the runtime: an unpinned Blender turns an add-on regression into
      # an indistinguishable "the runner changed" failure.
      BLENDER_VERSION: "4.2.13"
      BLENDER_SERIES: "4.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Install Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ARCHIVE="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          URL="https://download.blender.org/release/Blender${BLENDER_SERIES}/${ARCHIVE}"
          curl -fsSL --retry 3 -o "$ARCHIVE" "$URL"
          mkdir -p ~/blender
          tar -xJf "$ARCHIVE" -C ~/blender --strip-components=1
          ~/blender/blender --version

      - name: Build the add-on
        # A non-zero version on purpose: the smoke test asserts that the
        # build injected one, and 0.0.0-ci strips to the (0, 0, 0)
        # placeholder, which is indistinguishable from no injection.
        run: bash scripts/build_addon.sh 9.9.9-ci

      - name: Install the built archive as an extension
        run: |
          set -euo pipefail
          # Install by extracting the archive, so the job validates the shape
          # of the artifact users actually download rather than the source
          # tree. A nested root fails here exactly as it does for a user.
          DEST="$HOME/.config/blender/${BLENDER_SERIES}/extensions/user_default/tessera"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q tessera-v9.9.9-ci.zip -d "$DEST"
          test -f "$DEST/__init__.py" \
            || { echo "::error::__init__.py is not at the archive root"; exit 1; }
          test -f "$DEST/blender_manifest.toml" \
            || { echo "::error::blender_manifest.toml is not at the archive root"; exit 1; }

      - name: Smoke test in Blender
        run: |
          set -euo pipefail
          ~/blender/blender --background --factory-startup \
            --python scripts/smoke_test_addon.py
